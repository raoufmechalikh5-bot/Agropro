name: Build APK

concurrency:
  group: agropro-build-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Restore persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Missing DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
          if [ ! -s debug.keystore ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is invalid."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Persistent signing key restored and validated."
      - name: Validate App Check debug token
        env:
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APPCHECK_DEBUG_TOKEN:-}" ]; then
            echo "::error::Missing FIREBASE_APPCHECK_DEBUG_TOKEN repository secret."
            exit 1
          fi
      - run: gradle assembleDebug --no-configuration-cache
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
