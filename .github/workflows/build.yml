name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Setup persistent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          if [ -n "$CLEAN_B64" ] && echo "$CLEAN_B64" | base64 -d > debug.keystore 2>/dev/null && [ -s debug.keystore ]; then
            echo "Restored persistent keystore from secrets."
          else
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "========================================================"
            echo "COPY THE BASE64 STRING BELOW INTO GITHUB SECRET: DEBUG_KEYSTORE_BASE64"
            base64 -w 0 debug.keystore
            echo ""
            echo "========================================================"
          fi
      - run: gradle assembleDebug --no-configuration-cache
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
